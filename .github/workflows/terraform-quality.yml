name: terraform-quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        directory:
          - .
          - modules/subnets
          - modules/routes
          - modules/endpoints
          - modules/flow-logs
          - modules/internet
          - modules/ipam
          - modules/ipam-organization-admin
          - examples/minimal
          - examples/private-endpoints-ipam
          - examples/three-tier-nat
          - examples/multiple-vpcs
          - examples/ipam-hierarchy
          - examples/bring-your-own-flow-log-key
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      check_docs: true
